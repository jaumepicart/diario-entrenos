<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entrenos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Diario de Entrenos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: cabecera fija con pestañas; hoy arriba, calendario mensual, semana en filas por día, rutinas con dibujos. Tema grafito cálido con un color por deporte. */
:root {
  color-scheme: dark;
  --bg: #121316;
  --surface: #1C1E22;
  --surface-2: #26282D;
  --line: #373A41;
  --ink: #F2EFE9;
  --ink-2: #BDB9B0;
  --ink-3: #928E86;
  --accent: #EDE6D6;
  --on-accent: #17181B;
  --scrim: rgba(0, 0, 0, 0.7);
  --fig: #4A4D55;
  --gym: #A78BFA;
  --hyrox: #FB923C;
  --swim: #38BDF8;
  --bike: #4ADE80;
  --run: #FB7185;
  --other: #FACC15;
  --font-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 0;
}
html.lock { overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 720px; margin-inline: auto; padding-block: 0 48px; }

/* Cabecera */
.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: 10px;
  display: grid;
  gap: 10px;
  box-shadow: 0 0 0 100vmax var(--bg);
  clip-path: inset(0 -100vmax);
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 1;
}
.status { font-size: 12px; color: var(--ink-3); }
\1grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
}
.tab {
  border: 0;
  background: transparent;
  padding: 10px 4px;
  min-height: 44px;
  font-size: 14px;
  border-radius: 9px;
  font-weight: 700;
  color: var(--ink-2);
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }

/* Navegación de mes / semana */
.nav { display: flex; align-items: center; gap: 8px; margin-block: 14px 12px; }
.nav .title { flex: 1; min-width: 0; }
.nav h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 28px;
  line-height: 1.05;
 
}
.nav .sub { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.iconbtn {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
}
.btn {
  font-weight: 700;
  border-radius: 10px;
  padding: 10px 16px;
  min-height: 44px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: 14px; font-weight: 500; }
.btn.warn { border-color: var(--run); }
.btn:disabled, .iconbtn:disabled { opacity: 0.45; cursor: default; }

/* Resumen */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
.tile {
  background: var(--surface);
  background: color-mix(in srgb, var(--c) 16%, var(--surface));
  border: 1px solid var(--line);
  border-color: color-mix(in srgb, var(--c) 45%, var(--line));
  border-radius: 12px;
  padding: 12px;
  min-width: 0;
}
.tile .lab { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
.tile .big {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 38px;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}
.tile .big small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 4px; }
.tile .yr { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; display: inline-block; }
.s-gym { --c: var(--gym); }
.s-hyrox { --c: var(--hyrox); }
.s-other { --c: var(--other); }
.s-swim { --c: var(--swim); }
.s-bike { --c: var(--bike); }
.s-run { --c: var(--run); }
.daysline { margin: 10px 2px 0; font-size: 13px; color: var(--ink-2); }

/* Calendario */
.cal {
  margin-top: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
}
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); text-align: center; padding-block: 4px; }
.cell { min-width: 0; }
.day {
  min-height: 56px;
  border: 1px solid transparent;
  background: var(--surface-2);
  border-radius: 8px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  text-align: left;
}
.day:hover { border-color: var(--line); }
.day .num { font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 22px; height: 22px; display: inline-grid; place-items: center; }
.day.today .num { background: var(--accent); color: var(--on-accent); border-radius: 999px; font-weight: 700; }
.dots { display: flex; gap: 3px; flex-wrap: wrap; min-height: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }
.dot.plan { background: transparent; border: 1.5px solid var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.empty-note { margin: 12px 2px 0; font-size: 14px; color: var(--ink-2); }

/* Planificador */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  display: grid;
  gap: 10px;
}
.prog { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.prog .nm { display: flex; align-items: center; gap: 7px; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--c); }
.prog .val { font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.plist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.prow {
  display: grid;
  grid-template-columns: 50px minmax(0, 1fr) 44px;
  gap: 10px;
  align-items: center;
  padding: 8px 8px 8px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.prow.today { border-color: var(--accent); }
.pdate { display: grid; justify-items: center; line-height: 1.1; }
.pdate .dn { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.pdate .dd { font-family: var(--font-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.pitems { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.rest { color: var(--ink-3); font-size: 14px; }
.pchip {
  display: inline-flex;
  align-items: stretch;
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 8px;
  overflow: hidden;
  min-width: 0;
}
.pcheck {
  width: 36px;
  border: 0;
  border-right: 1px solid var(--line);
  background: transparent;
  color: transparent;
  display: grid;
  place-items: center;
}
.pchip.done .pcheck { background: var(--c); color: var(--on-accent); border-right-color: var(--c); }
.pchip:not(.done) .pcheck:hover { color: var(--ink-3); }
.pbody { border: 0; background: transparent; padding: 6px 10px; min-height: 38px; display: flex; gap: 7px; align-items: center; text-align: left; }
.pbody .pk { color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Hoja inferior */
.sheet-wrap {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: flex-end; justify-content: center;
  background: var(--scrim);
}
.sheet {
  width: 100%;
  max-width: 520px;
  max-height: 92%;
  overflow: auto;
  background: var(--surface);
  color: var(--ink);
  border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 14px;
  animation: up 0.18s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@media (min-width: 640px) {
  .sheet-wrap { align-items: center; }
  .sheet { border-radius: 18px; }
}
.sheet:focus { outline: none; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; }
.sheet-head .kick { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.hint {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px dashed var(--line);
  font-size: 14px;
}
.srow {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px 12px;
  background: var(--surface-2);
}
.srow.on {
  border-color: var(--c);
  background: var(--surface-2);
  background: color-mix(in srgb, var(--c) 12%, var(--surface));
}
.stoggle { display: flex; align-items: center; gap: 10px; min-height: 46px; cursor: pointer; font-weight: 700; }
.stoggle input { width: 22px; height: 22px; accent-color: var(--c); margin: 0; }
.sval { display: grid; gap: 8px; padding-block: 2px 8px; }
.field { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.field label { font-size: 13px; color: var(--ink-2); }
.num-in {
  width: 7.5rem;
  font-size: 16px;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.unit { color: var(--ink-2); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 6px 12px;
  min-height: 38px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.segopt { position: relative; display: block; }
.segopt input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.segopt span {
  display: flex; align-items: center; gap: 8px;
  min-height: 46px; padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  cursor: pointer;
  font-weight: 500;
}
.segopt input:checked + span {
  border-color: var(--c);
  font-weight: 700;
  background: var(--surface-2);
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
}
.segopt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.sheet-foot { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet-foot .primary { flex: 1; min-width: 140px; }
.x { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; display: grid; place-items: center; flex: none; }

/* Días hechos en el calendario */
.day { min-height: 92px; justify-content: flex-start; gap: 4px; padding: 5px; }
.day.has {
  background: var(--surface-2);
  background: color-mix(in srgb, var(--c) 22%, var(--surface-2));
  border-color: color-mix(in srgb, var(--c) 65%, var(--line));
}
.pills { display: grid; gap: 3px; width: 100%; min-width: 0; }
.pill {
  display: flex; gap: 4px; align-items: center;
  background: var(--c); color: var(--on-accent);
  font-size: 11px; font-weight: 700; line-height: 16px;
  padding: 0 5px; border-radius: 5px;
  white-space: nowrap; overflow: hidden;
  font-variant-numeric: tabular-nums;
}
.pill.plan { background: transparent; color: var(--ink-2); border: 1.5px dashed var(--c); line-height: 13px; font-weight: 500; }
.pill.more { background: var(--surface); color: var(--ink-2); }
@media (max-width: 479px) { .pill.hasv .pl { display: none; } }
.swp { width: 16px; height: 10px; border: 1.5px dashed var(--ink-3); border-radius: 3px; display: inline-block; }
.lh { margin: 20px 2px 8px; font-family: var(--font-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.03em; }
.llist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lrow {
  width: 100%;
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
}
.ldate { display: grid; justify-items: center; line-height: 1.1; }
.ldate .dn { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.ldate .dd { font-family: var(--font-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.lpills { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.lpill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--surface-2);
  background: color-mix(in srgb, var(--c) 24%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--c) 60%, var(--line));
  font-size: 13px; font-weight: 500;
}

/* Rutinas */
.intro { margin: 0 2px; font-size: 14px; color: var(--ink-2); }
.rcard { background: var(--surface); background: color-mix(in srgb, var(--c) 9%, var(--surface)); border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px 12px; margin-top: 12px; display: grid; gap: 10px; }
.rhead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px; }
.rhead h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; }
.rhead .sub { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.exlist { list-style: none; margin: 0; padding: 0; display: grid; }
.exrow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.exrow:first-child { border-top: 0; }
.sets { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }
.sets i { font-style: normal; font-size: 18px; color: var(--ink-3); margin-left: 2px; }
.exname { border: 0; background: transparent; text-align: left; padding: 4px 0; min-width: 0; display: grid; gap: 1px; }
.exname .en { font-weight: 700; }
.exname .eg { font-size: 13px; color: var(--ink-2); }
.step { display: inline-flex; gap: 6px; align-items: center; }
.cnt { min-width: 30px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.cnt i { font-style: normal; font-size: 15px; color: var(--ink-3); margin-left: 1px; }
.fig { width: 46px; height: 46px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; }
.fig svg { display: block; }
.tfield { display: grid; gap: 6px; padding-block: 2px 6px; }
.stp { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; font-size: 20px; line-height: 1; display: grid; place-items: center; }
.btn.done { border-color: var(--gym); background: var(--surface-2); background: color-mix(in srgb, var(--gym) 14%, var(--surface)); }
.chip[aria-pressed="true"] { border-color: var(--gym); font-weight: 700; background: var(--surface-2); background: color-mix(in srgb, var(--gym) 16%, var(--surface)); }
.txt-in { width: 100%; font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.lbl { font-size: 13px; color: var(--ink-2); }
.addex { justify-self: start; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 60;
  background: var(--accent);
  color: var(--on-accent);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  max-width: calc(100% - 32px);
  text-align: center;
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* Hoy, hoja del día, dibujos */
.kick { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.todaycard { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
.tcbody { display: grid; gap: 6px; min-width: 0; flex: 1 1 220px; }
.todaycard h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.05; }
.todaycard .sub { font-size: 14px; color: var(--ink-2); }
.sheet { border-radius: 22px 22px 0 0; gap: 16px; }
@media (min-width: 640px) { .sheet { border-radius: 22px; } }
.sheet-head h2 { font-size: 30px; }
.step-lbl { margin-bottom: 8px; font-weight: 700; }
.stiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stile { position: relative; display: block; }
.stile input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.stbody { display: grid; justify-items: center; align-content: center; gap: 6px; min-height: 74px; padding: 10px 6px; text-align: center; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); font-size: 14px; }
.stbody .sw { width: 14px; height: 14px; border-radius: 5px; }
.stile input:checked + .stbody { background: var(--c); border-color: var(--c); color: var(--on-accent); }
.stile input:checked + .stbody .sw { background: var(--on-accent); }
.stile input:focus-visible + .stbody { outline: 2px solid var(--accent); outline-offset: 2px; }
.dcards { display: grid; gap: 10px; }
.dcard { border: 1px solid var(--c); border-radius: 14px; padding: 12px; background: var(--surface); background: color-mix(in srgb, var(--c) 10%, var(--surface)); display: grid; gap: 10px; }
.dtitle { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; }
.num-in.big { font-family: var(--font-display); font-weight: 700; font-size: 30px; width: 7rem; padding: 4px 10px; }
.area { resize: vertical; min-height: 84px; line-height: 1.4; font-family: inherit; }
.plrows { display: grid; gap: 8px; }
.plrow { display: grid; gap: 4px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--c); background: var(--surface); background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.pltop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pltext { font-size: 14px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }

  function isoWeek(d) {

  }

  function docData(kind, date) {

  /* Copia local: la app abre al instante y se ve sin conexión */
  function cacheKey() { return 'entrenos-cache-' + userId(); }
  function cacheSave() {
    if (!userId()) return;

  }
  function cacheLoad() {
    try {
      var raw = localStorage.getItem(cacheKey());

      state.plans = o.plans || {};
      state.routines = o.routines || null;
      state.notes = o.notes || {};
      return true;
    } catch (e) { return false; }
  }

  function persist(kind, date) {
    if (!sb || !userId()) return Promise.resolve();
    cacheSave();
    var key = kind + '-' + date;
    pending[key] = (pending[key] || 0) + 1;
    var uid = userId();
    var run = function () {
      var data = docData(kind, date);
      var now = new Date().toISOString();
      var q;
      if (kind === 'l') {
        q = data ? sb.from('entries').upsert({ user_id: uid, day: date, acts: data.acts, note: data.note, updated_at: now }, { onConflict: 'user_id,day' })
                 : sb.from('entries').delete().eq('day', date);
      } else if (kind === 'p') {
        q = data ? sb.from('plans').upsert({ user_id: uid, day: date, items: data.items, updated_at: now }, { onConflict: 'user_id,day' })
                 : sb.from('plans').delete().eq('day', date);

        q = sb.from('routines').upsert({ user_id: uid, data: state.routines || [], updated_at: now }, { onConflict: 'user_id' });
      }

      rows = rows.concat(r.data || []);
      if (!r.data || r.data.length < step) break;
      from += step;
    }

  var SHORT = { gym: 'Gym', hyrox: 'Hyrox', swim: 'Nat', bike: 'Bici', run: 'Corr', other: 'Otro' };
  function pillHtml(s, a, planned) {
    var src = a || planned;
    var v = (isKm(s.id) && src && src.km != null) ? fmt(src.km) : '';
    return '<span class="pill s-' + s.id + (a ? '' : ' plan') + (v ? ' hasv' : '') + '"><span class="pl">' + SHORT[s.id] + '</span>' + (v ? '<span class="pv">' + v + '</span>' : '') + '</span>';
  }

  function actLabel(s, a) {
    var out = s.id === 'other' ? (a.note || 'Otros') : s.name;
    if (s.id === 'gym' && a.routine) out += ' · ' + routineShort(a.routine);
    if (s.id === 'hyrox' && a.note) out += ' · ' + a.note;
    if (a.km != null) out += ' · ' + fmt(a.km) + ' km';
    if (!isKm(s.id) && a.min != null) out += ' · ' + a.min + ' min';
    return esc(out);
  }

  function monthList(y, mo) {
    var dates = Object.keys(state.logs).filter(function (k) {
      var d = parse(k);
      return d.getFullYear() === y && d.getMonth() === mo && Object.keys(state.logs[k]).length;
    }).sort().reverse();
    if (!dates.length) return '';
    var rows = dates.map(function (date) {
      var d = parse(date), acts = state.logs[date];
      var chips = SPORTS.filter(function (s) { return acts[s.id]; }).map(function (s) {
        return '<span class="lpill s-' + s.id + '"><i class="sw"></i>' + actLabel(s, acts[s.id]) + '</span>';
      }).join('');
      return '<li><button class="lrow" data-act="open-day" data-date="' + date + '" aria-label="Abrir ' + longDate(d) + '">' +
        '<span class="ldate"><span class="dn">' + DAYS_S[(d.getDay() + 6) % 7] + '</span><span class="dd">' + d.getDate() + '</span></span>' +
        '<span class="lbody"><span class="lpills">' + chips + '</span>' + (state.notes[date] ? '<span class="lnote">' + esc(state.notes[date]) + '</span>' : '') + '</span></button></li>';
    }).join('');
    return '<h3 class="lh">Día a día</h3><ul class="llist">' + rows + '</ul>';
  }

  /* ---------- Vista: registro ---------- */
  function monthTotals(y, mo) {
    var m = zeroes();
    var yr = zeroes();
    var days = 0;
    Object.keys(state.logs).forEach(function (date) {
      var d = parse(date), acts = state.logs[date];
      var sameY = d.getFullYear() === y;
      var sameM = sameY && d.getMonth() === mo;
      if (sameM && Object.keys(acts).length) days++;
      SPORTS.forEach(function (s) {
        var a = acts[s.id];
        if (!a) return;
        var add = isKm(s.id) ? (a.km || 0) : 1;
        if (sameY) yr[s.id] += add;
        if (sameM) m[s.id] += add;
      });
    });
    return { m: m, yr: yr, days: days };
  }

  function renderLog() {
    var y = state.month.getFullYear(), mo = state.month.getMonth();
    var t = monthTotals(y, mo);
    var now = new Date();
    var isCurrent = now.getFullYear() === y && now.getMonth() === mo;
    var todayKey = ymd(now);

    var tiles = SPORTS.map(function (s) {
      var big, unit, yr;
      if (!isKm(s.id)) {
        big = String(t.m[s.id]); unit = t.m[s.id] === 1 ? 'día' : 'días';
        yr = 'año ' + t.yr[s.id] + (t.yr[s.id] === 1 ? ' día' : ' días');
      } else {
        big = fmt(t.m[s.id]); unit = 'km';
        yr = 'año ' + fmt(t.yr[s.id]) + ' km';
      }
      return '<div class="tile s-' + s.id + '"><div class="lab"><i class="sw"></i>' + s.name + '</div>' +
        '<div class="big">' + big + '<small>' + unit + '</small></div><div class="yr">' + yr + '</div></div>';
    }).join('');

    var first = new Date(y, mo, 1);
    var lead = (first.getDay() + 6) % 7;
    var dim = new Date(y, mo + 1, 0).getDate();
    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<span class="cell"></span>';
    for (var d = 1; d <= dim; d++) {
      var date = ymd(new Date(y, mo, d));
      var acts = state.logs[date] || {};
      var plan = state.plans[date] || [];
      var pills = '', done = [], first = null, shown = 0, extra = 0;
      SPORTS.forEach(function (s) {
        var a = acts[s.id];
        var planned = plan.filter(function (p) { return p.sport === s.id; })[0];
        if (!a && !planned) return;
        if (a) { done.push(s.name); if (!first) first = s.id; }
        if (shown < 3) { pills += pillHtml(s, a, planned); shown++; } else extra++;
      });
      if (extra) pills += '<span class="pill more">+' + extra + '</span>';
      var label = d + ' de ' + MONTHS[mo] + (done.length ? ': ' + done.join(', ') : '');
      cells += '<button class="cell day' + (first ? ' has s-' + first : '') + (date === todayKey ? ' today' : '') + '" data-act="open-day" data-date="' + date + '" aria-label="' + label + '">' +
        '<span class="num">' + d + '</span><span class="pills">' + pills + '</span></button>';
    }

    var hasLogs = Object.keys(state.logs).length > 0;
    var note = (!hasLogs && state.mode !== 'loading')
      ? '<p class="empty-note">Todavía no has apuntado ningún entreno. Toca un día del calendario para empezar.</p>'
      : '';

    return todayCard() + '<div class="nav">' +
        '<button class="iconbtn" data-act="prev-month" aria-label="Mes anterior">' + CHEV_L + '</button>' +
        '<div class="title"><h2>' + MONTHS[mo] + ' ' + y + '</h2></div>' +
        '<button class="btn small" data-act="this-month"' + (isCurrent ? ' disabled' : '') + '>Hoy</button>' +
        '<button class="iconbtn" data-act="next-month" aria-label="Mes siguiente">' + CHEV_R + '</button>' +
      '</div>' +
      '<div class="tiles">' + tiles + '</div>' +
      '<p class="daysline">' + t.days + (t.days === 1 ? ' día' : ' días') + ' con entreno este mes</p>' +
      note +
      '<div class="cal"><div class="grid7">' +
        WD_HEAD.map(function (w) { return '<span class="wd" aria-hidden="true">' + w + '</span>'; }).join('') + cells +
      '</div>' +
      '<div class="legend">' +
        SPORTS.map(function (s) { return '<span class="s-' + s.id + '"><i class="sw"></i>' + s.name + '</span>'; }).join('') +
        '<span><i class="swp"></i>planificado</span>' +
      '</div></div>' + monthList(y, mo);
  }

  /* ---------- Vista: planificador ---------- */
  function weekDates() {
    var out = [];
    for (var i = 0; i < 7; i++) out.push(ymd(addDays(state.week, i)));
    return out;
  }

  function renderPlan() {
    var dates = weekDates();
    var mon = state.week, sun = addDays(mon, 6);
    var now = new Date(), todayKey = ymd(now);
    var isCurrent = ymd(mondayOf(now)) === ymd(mon);

    var planned = zeroes(), doneT = zeroes();
    var anyPlan = false;
    dates.forEach(function (date) {
      (state.plans[date] || []).forEach(function (it) {
        anyPlan = true;
        planned[it.sport] += isKm(it.sport) ? (it.km || 0) : 1;
      });
      var acts = state.logs[date] || {};
      SPORTS.forEach(function (s) {
        if (acts[s.id]) doneT[s.id] += isKm(s.id) ? (acts[s.id].km || 0) : 1;
      });
    });

    var prog = SPORTS.map(function (s) {
      var p = planned[s.id], d = doneT[s.id];
      var pct = p > 0 ? Math.min(100, d / p * 100) : 0;
      var txt;
      if (!isKm(s.id)) txt = p > 0 ? d + ' / ' + p + ' días' : d + (d === 1 ? ' día' : ' días');
      else txt = p > 0 ? fmt(d) + ' / ' + fmt(p) + ' km' : fmt(d) + ' km';
      return '<div class="prog s-' + s.id + '"><span class="nm"><i class="sw"></i>' + s.name + '</span>' +
        '<div class="bar" role="img" aria-label="' + s.name + ': ' + txt + '"><i style="width:' + pct + '%"></i></div>' +
        '<span class="val">' + txt + '</span></div>';
    }).join('');

    var rows = dates.map(function (date, i) {
      var items = state.plans[date] || [];
      var acts = state.logs[date] || {};
      var d = parse(date);
      var chips = items.map(function (it) {
        var s = SPORT[it.sport];
        var done = !!acts[it.sport];
        var km = (isKm(it.sport) && it.km != null) ? '<span class="pk">' + fmt(it.km) + ' km</span>' : '';
        if (it.sport === 'other' && it.note) km = '<span class="pk">' + esc(it.note) + '</span>';
        if (it.sport === 'gym' && it.routine) km = '<span class="pk">' + esc(routineShort(it.routine)) + '</span>';
        return '<div class="pchip s-' + it.sport + (done ? ' done' : '') + '">' +
          '<button class="pcheck" data-act="toggle-done" data-date="' + date + '" data-id="' + it.id + '" aria-pressed="' + done + '" aria-label="' + (done ? 'Quitar como hecho: ' : 'Marcar como hecho: ') + s.name + '">' + CHECK + '</button>' +
          '<button class="pbody" data-act="edit-plan" data-date="' + date + '" data-id="' + it.id + '" aria-label="Editar ' + s.name + '"><i class="sw"></i><span>' + s.name + '</span>' + km + '</button></div>';
      }).join('') + items.filter(function (it) { return it.text; }).map(function (it) {
        return '<div class="ptext s-' + it.sport + '"><i class="sw"></i><span>' + esc(it.text) + '</span></div>';
      }).join('');
      return '<li class="prow' + (date === todayKey ? ' today' : '') + '">' +
        '<div class="pdate"><span class="dn">' + DAYS_S[i] + '</span><span class="dd">' + d.getDate() + '</span></div>' +
        '<div class="pitems">' + (chips || '<span class="rest">Descanso</span>') + '</div>' +
        '<button class="iconbtn" data-act="add-plan" data-date="' + date + '" aria-label="Añadir sesión el ' + longDate(d) + '">+</button></li>';
    }).join('');

    var range = mon.getDate() + ' ' + MONTHS_S[mon.getMonth()] + ' – ' + sun.getDate() + ' ' + MONTHS_S[sun.getMonth()];
    var clearTxt = state.confirm === 'clear' ? 'Toca otra vez para vaciar' : 'Vaciar semana';

    return '<div class="nav">' +
        '<button class="iconbtn" data-act="prev-week" aria-label="Semana anterior">' + CHEV_L + '</button>' +
        '<div class="title"><h2>Semana ' + isoWeek(mon) + '</h2><div class="sub">' + range + ' · ' + sun.getFullYear() + '</div></div>' +
        '<button class="btn small" data-act="this-week"' + (isCurrent ? ' disabled' : '') + '>Hoy</button>' +
        '<button class="iconbtn" data-act="next-week" aria-label="Semana siguiente">' + CHEV_R + '</button>' +
      '</div>' +
      '<div class="panel" aria-label="Progreso de la semana">' + prog +
        (anyPlan ? '' : '<div class="rest">Esta semana no tiene sesiones planificadas. Usa el + de cada día.</div>') +
      '</div>' +
      '<ul class="plist">' + rows + '</ul>' +
      '<div class="actions">' +
        '<button class="btn small" data-act="copy-prev">Copiar semana anterior</button>' +
        '<button class="btn small" data-act="repeat-4">Repetir 4 semanas</button>' +
        '<button class="btn small' + (state.confirm === 'clear' ? ' warn' : '') + '" data-act="clear-week">' + clearTxt + '</button>' +
      '</div>';
  }

  function hyroxFieldsHtml(a) {
    return '<div class="tfield"><label class="lbl" for="note-hyrox">Detalle (opcional)</label>' +
      '<input class="txt-in" id="note-hyrox" type="text" maxlength="60" placeholder="Simulación, SkiErg y trineo…" value="' + (a && a.note ? esc(a.note) : '') + '"></div>';
  }
  function otherFieldsHtml(a) {
    return '<div class="tfield"><label class="lbl" for="note-other">¿Qué deporte?</label>' +
      '<input class="txt-in" id="note-other" type="text" maxlength="40" placeholder="Pádel, fútbol, senderismo…" value="' + (a && a.note ? esc(a.note) : '') + '"></div>' +
      '<div class="field"><label for="km-other">Distancia (opcional)</label>' +
      '<input class="num-in" id="km-other" type="text" inputmode="decimal" autocomplete="off" placeholder="0,0" value="' + dec(a && a.km) + '"><span class="unit">km</span></div>';
  }

/* Dibujos de ejercicios: dos poses (inicio y final) en vista lateral, figura de palitos */
  function L(x1, y1, x2, y2, c) { return [x1, y1, x2, y2, c || 'b']; }
  function side(h, s, p, e, w, k, a, x) {
    x = x || {};
    var f = x.f || [a[0] + 3, a[1]];
    var l = [L(s[0], s[1], p[0], p[1]), L(p[0], p[1], k[0], k[1]), L(k[0], k[1], a[0], a[1]), L(a[0], a[1], f[0], f[1])];
    if (e) l.push(L(s[0], s[1], e[0], e[1], 'm'), L(e[0], e[1], w[0], w[1], 'm'));
    return { h: h, l: l, eq: x.eq || '' };
  }
  function ln(x1, y1, x2, y2, cls) { return '<line' + (cls ? ' class="' + cls + '"' : '') + ' x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>'; }
  function pl(x, y, r) { return '<circle class="fl" cx="' + x + '" cy="' + y + '" r="' + (r || 2.8) + '"/>'; }

  var FIGS = {

    ],

      side([19, 9], [19, 16], [19, 31], [24, 10], [26, 3], [30, 31], [31, 43], { eq: Q_SEAT + pl(26, 3, 1.8) })

        eq: ln(16.5, 29, 21.5, 29, 'th') + ln(26.5, 29, 31.5, 29, 'th') },
      { h: [24, 7], l: [L(24, 13, 24, 29), L(24, 29, 20, 44), L(24, 29, 28, 44), L(24, 14, 11, 14.5, 'm'), L(24, 14, 37, 14.5, 'm')],

  function poseSvg(po) {

  function authMsg(text, ok) {

  function authError(err) {
    var m = String((err && err.message) || err || '').toLowerCase();
    if (m.indexOf('invalid login') >= 0) return 'Correo o contraseña incorrectos.';
    if (m.indexOf('already registered') >= 0) return 'Ese correo ya tiene cuenta. Entra con tu contraseña.';
    if (m.indexOf('not confirmed') >= 0) return 'Falta confirmar el correo. Abre el enlace que te enviamos.';
    if (m.indexOf('rate limit') >= 0 || m.indexOf('too many') >= 0) return 'Demasiados intentos. Espera unos minutos y prueba otra vez.';
    if (m.indexOf('password') >= 0 && (m.indexOf('least') >= 0 || m.indexOf('weak') >= 0 || m.indexOf('short') >= 0)) return 'La contraseña es demasiado corta o débil. Usa al menos 8 caracteres.';
    if (m.indexOf('valid email') >= 0 || m.indexOf('invalid email') >= 0) return 'Ese correo no es válido.';
    if (m.indexOf('fetch') >= 0 || m.indexOf('network') >= 0) return 'No hay conexión. Comprueba internet.';
    return 'No se pudo completar. Inténtalo otra vez.';
  }
  function setBusy(on) {
    authBusy = on;
    var b = document.querySelector('#authform button[type=submit], #newpassform button[type=submit]');
    if (b) b.disabled = on;
  }

  async function doAuth() {
    if (authBusy || !sb) return;
    var email = document.getElementById('auth-email').value.trim();
    var pass = document.getElementById('auth-pass').value;
    authEmail = email;
    if (!email || email.indexOf('@') < 1) { authMsg('Escribe tu correo.'); return; }
    if (!pass) { authMsg('Escribe tu contraseña.'); return; }
    if (authView === 'signup' && pass.length < 8) { authMsg('La contraseña necesita al menos 8 caracteres.'); return; }
    setBusy(true); authMsg('');
    try {
      if (authView === 'signup') {
        var r = await sb.auth.signUp({ email: email, password: pass, options: { emailRedirectTo: location.origin + location.pathname } });
        if (r.error) throw r.error;
        if (r.data && r.data.user && r.data.user.identities && r.data.user.identities.length === 0) { authMsg('Ese correo ya tiene cuenta. Entra con tu contraseña.'); }
        else if (!r.data || !r.data.session) { authMsg('Te hemos enviado un correo. Ábrelo para confirmar la cuenta y vuelve aquí para entrar.', true); }
      } else {
        var s = await sb.auth.signInWithPassword({ email: email, password: pass });
        if (s.error) throw s.error;
      }
    } catch (err) { authMsg(authError(err)); }
    setBusy(false);
  }

  async function doForgot() {
    var el = document.getElementById('auth-email');
    var email = el ? el.value.trim() : '';
    authEmail = email;
    if (!email || email.indexOf('@') < 1) { authMsg('Escribe tu correo arriba y vuelve a pulsar.'); return; }
    try {
      var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if (r.error) throw r.error;
      authMsg('Si ese correo tiene cuenta, te hemos enviado un enlace para crear una contraseña nueva.', true);
    } catch (err) { authMsg(authError(err)); }
  }

  async function doNewPass() {
    if (authBusy || !sb) return;
    var pass = document.getElementById('auth-pass').value;
    if (pass.length < 8) { authMsg('La contraseña necesita al menos 8 caracteres.'); return; }
    setBusy(true); authMsg('');
    try {
      var r = await sb.auth.updateUser({ password: pass });
      if (r.error) throw r.error;
      toast('Contraseña cambiada');
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      startSession();
    } catch (err) { authMsg(authError(err)); }

  }

  async function startSession() {
    var uid = userId();
    state.logs = {}; state.plans = {}; state.routines = null; state.notes = {};
    pending = {}; failed = {}; chains = {};
    state.strava = 'unknown';
    var cached = cacheLoad();
    state.mode = cached ? 'db' : 'loading';
    render();
    try { await loadAll(); state.mode = 'db'; }
    catch (e) { state.mode = cached ? 'offline' : 'off'; }
    if (userId() === uid) render();
    if (userId() === uid && state.mode === 'db') { if (stravaReturn) stravaFinish(); else stravaSync(false); }
  }

  /* ---------- Bloqueo con Face ID / huella (WebAuthn, solo en este dispositivo) ---------- */
  var LOCK_KEY = 'entrenos-lock';
  var lockAvail = false;
  var hiddenAt = 0;
  var LOCK_AFTER_MS = 60000;
  function isApple() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function bioName() { return isApple() ? 'Face ID' : 'huella o rostro'; }
  function b64u(buf) { var t = ''; new Uint8Array(buf).forEach(function (x) { t += String.fromCharCode(x); }); return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64u(str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; var bin = atob(str), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function rnd(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
  function lockId() { try { return localStorage.getItem(LOCK_KEY); } catch (e) { return null; } }
  function lockEnabled() { return !!lockId(); }

  function lockBtnHtml() {
    if (!lockAvail && !lockEnabled()) return '';
    return '<button class="linkbtn" data-act="lock-toggle">' + (lockEnabled() ? 'Quitar bloqueo' : 'Activar ' + esc(bioName())) + '</button>';
  }
  function lockHtml() {
    return '<main class="authwrap"><div class="authcard">' +
      '<h1 class="authtitle">Diario de entrenos</h1>' +
      '<p class="intro">App bloqueada. Usa ' + esc(bioName()) + ' para entrar.</p>' +
      '<p class="autherr" id="autherr" role="alert"></p>' +
      '<button class="btn primary" data-act="unlock">Desbloquear con ' + esc(bioName()) + '</button>' +
      '<button class="linkbtn center" data-act="lock-reset">No puedo desbloquear: entrar con contraseña</button>' +
      '</div></main>';
  }

  async function enableLock() {
    try {
      var cred = await navigator.credentials.create({ publicKey: {
        challenge: rnd(32),
        rp: { name: 'Diario de Entrenos' },
        user: { id: rnd(16), name: userEmail() || 'usuario', displayName: 'Entrenos' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
        timeout: 60000, attestation: 'none'
      } });
      if (!cred) throw new Error('sin credencial');
      localStorage.setItem(LOCK_KEY, b64u(cred.rawId));
      toast('Bloqueo activado');
      render();
    } catch (e) { toast('No se pudo activar el bloqueo.'); }
  }
  async function verifyLock() {
    var id = lockId();
    if (!id) return true;
    var r = await navigator.credentials.get({ publicKey: {
      challenge: rnd(32),
      allowCredentials: [{ type: 'public-key', id: unb64u(id), transports: ['internal'] }],
      userVerification: 'required', timeout: 60000
    } });
    return !!r;
  }
  async function unlock(auto) {
    try {
      if (await verifyLock()) { state.locked = false; hiddenAt = 0; render(); }
    } catch (e) { if (!auto) authMsg('No se pudo verificar. Inténtalo otra vez.'); }
  }
  async function disableLock() {
    try {
      if (await verifyLock()) { localStorage.removeItem(LOCK_KEY); toast('Bloqueo quitado'); render(); }
    } catch (e) { toast('No se pudo verificar.'); }
  }
  function lockNow() {
    state.locked = true;
    if (!sheetEl.hidden) closeSheet();
    render();
    setTimeout(function () { unlock(true); }, 250);
  }

  function endSession() {
    try { localStorage.removeItem(LOCK_KEY); } catch (e) {}
    var id = userId();
    try { if (id) localStorage.removeItem('entrenos-cache-' + id); } catch (e) {}
    session = null;
    state.logs = {}; state.plans = {}; state.routines = null; state.notes = {};
    pending = {}; failed = {}; chains = {};
    state.mode = 'auth'; authView = 'login'; state.strava = 'unknown';
    if (!sheetEl.hidden) closeSheet();
    render();
  }

  function render() {
    var app = document.getElementById('app');
    if (state.locked) { app.innerHTML = lockHtml(); return; }
    if (state.mode === 'auth' || state.mode === 'recovery') { app.innerHTML = authHtml(); return; }
    if (state.mode === 'loading' && !userId()) { app.innerHTML = '<main class="authwrap"><p class="intro">Cargando…</p></main>'; return; }
    app.innerHTML = headerHtml() + '<main id="panel" role="tabpanel" aria-labelledby="tab-' + state.tab + '">' +
      (state.tab === 'log' ? renderLog() : state.tab === 'plan' ? renderPlan() : state.tab === 'year' ? renderYear() : renderRoutines()) + '</main>';
  }

  /* ---------- Año: constancia ---------- */
  function hasAct(date) { var a = state.logs[date]; return !!(a && Object.keys(a).length); }
  function dayDiff(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
  function streaks() {
    var dates = Object.keys(state.logs).filter(hasAct).sort();
    var best = 0, run = 0, prev = null, set = {};
    dates.forEach(function (d) {
      set[d] = true;
      run = (prev && dayDiff(prev, d) === 1) ? run + 1 : 1;
      if (run > best) best = run;
      prev = d;
    });
    var now = new Date();
    var cursor = set[ymd(now)] ? now : addDays(now, -1), cur = 0;
    while (set[ymd(cursor)]) { cur++; cursor = addDays(cursor, -1); }
    return { cur: cur, best: best };
  }
  function ytile(label, big, small, sub) {
    return '<div class="tile neutral"><div class="lab">' + label + '</div><div class="big">' + big + (small ? '<small>' + small + '</small>' : '') + '</div><div class="yr">' + sub + '</div></div>';
  }

  function renderYear() {
    var y = state.year, now = new Date(), todayKey = ymd(now), curYear = now.getFullYear();
    var st = streaks();
    var blocks = '', total = 0, planTot = 0, planDone = 0, bestM = -1, bestN = 0;
    for (var m = 0; m < 12; m++) {
      var dim = new Date(y, m + 1, 0).getDate();
      var lead = (new Date(y, m, 1).getDay() + 6) % 7;
      var cells = '', n = 0, miss = 0;
      for (var i = 0; i < lead; i++) cells += '<span></span>';
      for (var d = 1; d <= dim; d++) {
        var date = ymd(new Date(y, m, d));
        var acts = state.logs[date] || {};
        var plan = state.plans[date] || [];
        var sp = SPORTS.filter(function (x) { return acts[x.id]; });
        var cls = 'yd', style = '', label = d + ' de ' + MONTHS[m];
        if (sp.length) {
          n++; cls += ' on';
          var c1 = 'var(--' + sp[0].id + ')';
          style = sp[1] ? 'background:linear-gradient(135deg,' + c1 + ' 50%,var(--' + sp[1].id + ') 50%)' : 'background:' + c1;
          label += ': ' + sp.map(function (x) { return x.name; }).join(', ');
        } else if (date < todayKey) {
          if (plan.length) { cls += ' miss'; miss++; label += ': plan sin hacer'; }
        } else {
          cls += plan.length ? ' fut futplan' : ' fut';
        }
        if (date < todayKey) plan.forEach(function (p) { planTot++; if (acts[p.sport]) planDone++; });
        if (date === todayKey) cls += ' today';
        cells += '<button class="' + cls + '"' + (style ? ' style="' + style + '"' : '') + ' data-act="open-day" data-date="' + date + '" aria-label="' + label + '"></button>';
      }
      total += n;
      if (n > bestN) { bestN = n; bestM = m; }
      blocks += '<section class="mblock" aria-label="' + MONTHS[m] + '"><div class="mhead">' +
        '<button class="mname" data-act="goto-month" data-m="' + m + '">' + MONTHS[m] + '</button>' +
        '<span class="mcount">' + n + (n === 1 ? ' día' : ' días') + (miss ? '<span class="miss"> · ' + miss + (miss === 1 ? ' fallo' : ' fallos') + '</span>' : '') + '</span></div>' +
        '<div class="mdays">' + cells + '</div></section>';
    }

    var elapsed = y < curYear ? Math.round((new Date(y + 1, 0, 1) - new Date(y, 0, 1)) / 86400000)
      : (y === curYear ? Math.round((parse(todayKey) - new Date(y, 0, 1)) / 86400000) + 1 : 0);
    var wk = 0, wkAct = 0;
    var endD = y < curYear ? new Date(y, 11, 31) : (y === curYear ? now : null);
    if (endD) {
      for (var w = mondayOf(new Date(y, 0, 1)); w <= endD; w = addDays(w, 7)) {
        wk++;
        for (var k = 0; k < 7; k++) { if (hasAct(ymd(addDays(w, k)))) { wkAct++; break; } }
      }
    }
    var pct = planTot ? Math.round(planDone / planTot * 100) : null;

    var tiles =
      ytile('Días entrenados', total, total === 1 ? 'día' : 'días', elapsed ? 'de ' + elapsed + ' del año' : 'año por empezar') +
      ytile('Racha actual', st.cur, st.cur === 1 ? 'día' : 'días', st.cur ? 'seguidos' : 'empieza hoy') +
      ytile('Mejor racha', st.best, st.best === 1 ? 'día' : 'días', 'de todo tu historial') +
      ytile('Semanas activas', wkAct, wk ? 'de ' + wk : '', 'con algún entreno') +
      ytile('Plan cumplido', planTot ? planDone : '–', planTot ? 'de ' + planTot : '', pct == null ? 'nada planificado aún' : pct + ' % de lo planificado') +
      ytile('Mejor mes', bestM >= 0 && bestN ? MONTHS_S[bestM] : '–', bestN ? bestN + (bestN === 1 ? ' día' : ' días') : '', 'más días entrenados');

    return '<div class="nav">' +
        '<button class="iconbtn" data-act="prev-year" aria-label="Año anterior">' + CHEV_L + '</button>' +
        '<div class="title"><h2>' + y + '</h2><div class="sub">Tu constancia mes a mes</div></div>' +
        '<button class="btn small" data-act="this-year"' + (y === curYear ? ' disabled' : '') + '>Hoy</button>' +
        '<button class="iconbtn" data-act="next-year" aria-label="Año siguiente">' + CHEV_R + '</button>' +
      '</div>' +
      '<div class="tiles">' + tiles + '</div>' +
      '<p class="intro ymsg">Cada cuadro es un día. El color es lo que entrenaste, y si hiciste dos deportes el cuadro se parte en dos colores. El rojo discontinuo marca un día con plan que no cumpliste.</p>' +
      '<div class="ygrid">' + blocks + '</div>' +
      '<div class="legend">' +
        SPORTS.map(function (s) { return '<span class="s-' + s.id + '"><i class="sw"></i>' + s.name + '</span>'; }).join('') +
        '<span><i class="swp miss"></i>plan sin hacer</span><span><i class="swp rest"></i>descanso</span>' +
      '</div>';
  }

  /* ---------- Hojas ---------- */
  var sheetEl = document.getElementById('sheet');
  var panelEl = sheetEl.querySelector('.sheet');
  var lastFocus = null;
  function q(sel) { return panelEl.querySelector(sel); }

  function openSheet(html) {
    lastFocus = document.activeElement;
    panelEl.innerHTML = html;
    sheetEl.hidden = false;
    document.documentElement.classList.add('lock');
    panelEl.scrollTop = 0;
    panelEl.focus({ preventScroll: true });
  }
  function closeSheet() {
    flushSheet();
    sheetEl.hidden = true;
    document.documentElement.classList.remove('lock');
    state.sheet = null;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }

  function chipsHtml(sport) {
    return SPORT[sport].chips.map(function (v) {
      return '<button type="button" class="chip" data-act="chip" data-sport="' + sport + '" data-v="' + v + '">' + fmt(v) + '</button>';
    }).join('');
  }

  function openDay(date) {
    if (state.mode === 'loading') { toast('Cargando tus datos…'); return; }
    if (date > ymd(new Date())) { openPlanDay(date); return; }
    var d = parse(date);
    var acts = state.logs[date] || {};
    var plan = state.plans[date] || [];
    var note = state.notes[date] || '';
    state.sheet = { type: 'day', date: date, routine: (acts.gym && acts.gym.routine) || null };

    var hint = '';
    if (plan.length) {
      var txt = plan.map(function (p) {
        return SPORT[p.sport].name + (isKm(p.sport) && p.km != null ? ' ' + fmt(p.km) + ' km' : '') + (p.sport === 'other' && p.note ? ' (' + esc(p.note) + ')' : '');
      }).join(' · ');
      hint = '<div class="hint"><span><b>Tenías planificado</b><br>' + txt + '</span><button type="button" class="btn small" data-act="use-plan">Usar plan</button></div>';
    }

    var tiles = SPORTS.map(function (s) {
      return '<label class="stile s-' + s.id + '"><input type="checkbox" id="chk-' + s.id + '" data-sport="' + s.id + '"' + (acts[s.id] ? ' checked' : '') + '><span class="stbody"><i class="sw"></i><b>' + s.name + '</b></span></label>';
    }).join('');

    var cards = SPORTS.map(function (s) {
      var a = acts[s.id];
      var v = a ? actValue(s.id, a) : null;
      return '<div class="dcard s-' + s.id + '" id="row-' + s.id + '"' + (a ? '' : ' hidden') + '>' +
        '<div class="dtitle"><i class="sw"></i>' + s.name + '</div>' +
        '<div class="field"><label for="val-' + s.id + '">' + s.label + '</label>' +
        '<input class="num-in big" id="val-' + s.id + '" type="text" inputmode="decimal" autocomplete="off" placeholder="0,0" value="' + dec(v) + '">' +
        '<span class="unit">' + s.unit + '</span></div>' +
        '<div class="chips">' + chipsHtml(s.id) + '</div>' +
        (s.id === 'gym' ? routineChipsHtml(a && a.routine) : '') +
        (s.id === 'hyrox' ? hyroxFieldsHtml(a) : '') +
        (s.id === 'other' ? otherFieldsHtml(a) : '') + '</div>';
    }).join('');

    openSheet(
      '<div class="sheet-head"><div><div class="kick">' + (date === ymd(new Date()) ? 'Hoy' : 'Registro del día') + '</div><h2 id="sheet-title">' + longDate(d) + '</h2></div>' +
      '<button class="x" data-act="close-sheet" aria-label="Cerrar">' + CLOSE + '</button></div>' +
      hint +
      '<div><div class="lbl step-lbl">¿Qué has hecho?</div><div class="stiles">' + tiles + '</div></div>' +
      '<div class="dcards">' + cards + '</div>' +
      '<div class="tfield"><label class="lbl" for="day-note">Explica el entreno</label><textarea class="txt-in area" id="day-note" rows="3" maxlength="600" placeholder="Qué has hecho, series, pesos, ritmo, cómo te has sentido…">' + esc(note) + '</textarea></div>' +
      '<div class="sheet-foot"><button class="btn primary" data-act="close-sheet">Listo</button>' +
      '<button class="btn" data-act="clear-day">Borrar día</button>' +
      '<span class="savestate" id="savestate" role="status" aria-live="polite">Se guarda solo</span></div>'
    );
  }

  function openPlanDay(date) {
    var d = parse(date);
    var items = state.plans[date] || [];
    state.sheet = { type: 'planday', date: date };
    var rows = items.map(function (it) {
      var sp = SPORT[it.sport];
      var extra = isKm(it.sport) && it.km != null ? fmt(it.km) + ' km' : (it.sport === 'gym' && it.routine ? routineShort(it.routine) : (it.sport === 'other' && it.note ? it.note : ''));
      return '<button class="plrow s-' + it.sport + '" data-act="edit-plan" data-date="' + date + '" data-id="' + it.id + '"><span class="pltop"><i class="sw"></i><b>' + sp.name + '</b>' + (extra ? '<span>' + esc(extra) + '</span>' : '') + '</span>' +
        (it.text ? '<span class="pltext">' + esc(it.text) + '</span>' : '') + '</button>';
    }).join('');
    openSheet(
      '<div class="sheet-head"><div><div class="kick">Planificar</div><h2 id="sheet-title">' + longDate(d) + '</h2></div>' +
      '<button class="x" data-act="close-sheet" aria-label="Cerrar">' + CLOSE + '</button></div>' +
      (rows ? '<div class="plrows">' + rows + '</div>' : '<p class="intro">Todavía no hay nada planificado este día.</p>') +
      '<div class="sheet-foot"><button class="btn primary" data-act="add-plan" data-date="' + date + '">Añadir sesión</button></div>'
    );
  }


  function readNumber(id) {
    var raw = q('#' + id).value.trim().replace(/\s+/g, '').replace(/km$/i, '').replace(',', '.');
    if (raw === '') return { ok: true, v: null };
    var v = Number(raw);
    if (!isFinite(v) || v < 0 || v > 1000) return { ok: false };
    return { ok: true, v: v };
  }

  /* ---------- Guardado automático ---------- */
  var autoTimer = null;
  function canon(v) {
    if (Array.isArray(v)) return v.map(canon);
    if (v && typeof v === 'object') { var o = {}; Object.keys(v).sort().forEach(function (k) { o[k] = canon(v[k]); }); return o; }
    return v;
  }
  function same(a, b) { return JSON.stringify(canon(a)) === JSON.stringify(canon(b)); }
  function setSaveState(txt) { var el = q('#savestate'); if (el) el.textContent = txt; }
  function savedText(key) { return failed[key] ? 'Sin conexión: se guardará al volver internet' : 'Guardado ✓'; }

  function collectDay() {
    var acts = {}, bad = null;
    for (var i = 0; i < SPORTS.length; i++) {
      var s = SPORTS[i];
      if (!q('#chk-' + s.id).checked) continue;
      var r = readNumber('val-' + s.id);
      if (!r.ok) { bad = bad || s.name; continue; }
      if (s.id === 'gym') acts[s.id] = { min: r.v, routine: state.sheet.routine || null };
      else if (s.id === 'hyrox') acts[s.id] = { min: r.v, note: q('#note-hyrox').value.trim() };
      else if (s.id === 'other') {
        var kr = readNumber('km-other');
        if (!kr.ok) { bad = bad || 'Otros'; continue; }
        acts[s.id] = { min: r.v, km: kr.v, note: q('#note-other').value.trim() };
      } else acts[s.id] = { km: r.v };
    }
    return { acts: acts, note: q('#day-note').value.trim(), bad: bad };
  }

  function autoSaveDay(final) {
    clearTimeout(autoTimer);
    var sh = state.sheet;
    if (!sh || sh.type !== 'day' || sh.skipFlush || sheetEl.hidden) return;
    var c = collectDay();
    if (c.bad) { if (final) toast('Revisa el valor de ' + c.bad); setSaveState('Revisa el valor de ' + c.bad); return; }
    var date = sh.date;
    if (same(state.logs[date] || {}, c.acts) && (state.notes[date] || '') === c.note) return;
    setSaveState('Guardando…');
    var pr = setDay(date, c.acts, c.note);
    render();
    pr.then(function () { if (state.sheet === sh) setSaveState(savedText('l-' + date)); });
  }

  function autoSavePlan(final, force) {
    clearTimeout(autoTimer);
    var sh = state.sheet;
    if (!sh || sh.type !== 'plan' || sh.skipFlush || sheetEl.hidden) return;
    var sel = q('input[name=psport]:checked');
    if (!sel) return;
    var sport = sel.value, km = null;
    if (isKm(sport)) {
      var r = readNumber('pkm');
      if (!r.ok) { if (final) toast('Revisa los km'); setSaveState('Revisa los km'); return; }
      km = r.v;
    }
    var item = { id: sh.id || uid(), sport: sport, km: km, routine: sport === 'gym' ? (sh.routine || null) : null,
      note: sport === 'other' ? q('#pnote').value.trim() : null, text: q('#ptext').value.trim() };
    var items = cloneItems(sh.date), idx = -1;
    for (var i = 0; i < items.length; i++) if (items[i].id === item.id) idx = i;
    if (idx < 0 && !sh.touched && !force) return;
    if (idx >= 0) { if (same(items[idx], item)) return; items[idx] = item; } else items.push(item);
    sh.id = item.id;
    state.lastSport = sport;
    var del = q('#plan-del'); if (del) del.hidden = false;
    setSaveState('Guardando…');
    var pr = setPlan(sh.date, items);
    render();
    pr.then(function () { if (state.sheet === sh) setSaveState(savedText('p-' + sh.date)); });
  }

  function flushSheet() {
    var sh = state.sheet;
    if (!sh) return;
    if (sh.type === 'day') autoSaveDay(true);
    else if (sh.type === 'plan') autoSavePlan(true, false);
  }
  function sheetAuto(immediate) {
    var sh = state.sheet;
    if (!sh || (sh.type !== 'day' && sh.type !== 'plan')) return;
    if (sh.type === 'plan') sh.touched = true;
    clearTimeout(autoTimer);
    var run = function () { if (sh.type === 'day') autoSaveDay(false); else autoSavePlan(false, false); };
    if (immediate) run(); else autoTimer = setTimeout(run, 600);
  }

  function usePlan() {
    var plan = state.plans[state.sheet.date] || [];
    plan.forEach(function (p) {
      var cb = q('#chk-' + p.sport);
      if (cb.checked) return;
      cb.checked = true;
      toggleRow(p.sport, true);
      if (p.sport !== 'gym' && p.km != null) q('#val-' + p.sport).value = dec(p.km);
      if (p.sport === 'gym' && p.routine) { state.sheet.routine = p.routine; syncRoutineChips(); }
      if (p.sport === 'other' && p.note) q('#note-other').value = p.note;
      if (p.text) { var dn = q('#day-note'); if (dn && dn.value.indexOf(p.text) < 0) dn.value = (dn.value ? dn.value + '\n' : '') + p.text; }
    });
  }

  function toggleRow(sport, on) {
    var row = q('#row-' + sport);
    if (row) row.hidden = !on;
  }

  function openPlan(date, id) {
    if (state.mode === 'loading') { toast('Cargando tus datos…'); return; }
    var d = parse(date);
    var it = id ? (state.plans[date] || []).filter(function (x) { return x.id === id; })[0] : null;
    var sport = it ? it.sport : state.lastSport;
    state.sheet = { type: 'plan', date: date, id: it ? it.id : null, routine: (it && it.routine) || null };

    var opts = SPORTS.map(function (s) {
      return '<label class="segopt s-' + s.id + '"><input type="radio" name="psport" id="ps-' + s.id + '" value="' + s.id + '"' + (s.id === sport ? ' checked' : '') + '><span><i class="sw"></i>' + s.name + '</span></label>';
    }).join('');

    openSheet(
      '<div class="sheet-head"><div><div class="kick">' + (it ? 'Editar sesión' : 'Añadir sesión') + '</div><h2 id="sheet-title">' + longDate(d) + '</h2></div>' +
      '<button class="x" data-act="close-sheet" aria-label="Cerrar">' + CLOSE + '</button></div>' +
      '<fieldset class="seg"><legend class="sr">Deporte</legend>' + opts + '</fieldset>' +
      '<div id="pkm-wrap" style="display:grid;gap:8px"' + (!isKm(sport) ? ' hidden' : '') + '>' +
        '<div class="field"><label for="pkm">Km previstos (opcional)</label>' +
        '<input class="num-in" id="pkm" type="text" inputmode="decimal" autocomplete="off" placeholder="0,0" value="' + dec(it && it.km) + '"><span class="unit">km</span></div>' +
        '<div class="chips" id="pchips">' + chipsHtml(isKm(sport) ? sport : 'run') + '</div></div>' +
      '<div id="proutine-wrap" style="display:grid;gap:8px"' + (sport === 'gym' ? '' : ' hidden') + '>' + routineChipsHtml(state.sheet.routine) + '</div>' +
      '<div id="pnote-wrap" class="tfield"' + (sport === 'other' ? '' : ' hidden') + '><label class="lbl" for="pnote">¿Qué deporte?</label><input class="txt-in" id="pnote" type="text" maxlength="40" placeholder="Pádel, fútbol, senderismo…" value="' + (it && it.note ? esc(it.note) : '') + '"></div>' +
      '<div class="tfield"><label class="lbl" for="ptext">Explica el entreno (opcional)</label><textarea class="txt-in area" id="ptext" rows="3" maxlength="400" placeholder="Ej: 10 × 400 m a ritmo fuerte, 1 min de descanso">' + esc(it && it.text ? it.text : '') + '</textarea></div>' +
      '<div class="sheet-foot"><button class="btn primary" data-act="plan-done">' + (it ? 'Listo' : 'Añadir') + '</button>' +
      '<button class="btn" id="plan-del" data-act="delete-plan"' + (it ? '' : ' hidden') + '>Quitar</button>' +
      '<span class="savestate" id="savestate" role="status" aria-live="polite">' + (it ? 'Se guarda solo' : '') + '</span></div>'
    );
  }

  function deletePlan() {
    var sh = state.sheet;
    sh.skipFlush = true;
    setPlan(sh.date, cloneItems(sh.date).filter(function (x) { return x.id !== sh.id; }));
    closeSheet();
    render();
    toast('Sesión quitada');
  }

  function toggleDone(date, id) {
    var it = (state.plans[date] || []).filter(function (x) { return x.id === id; })[0];
    if (!it) return;
    var acts = {};
    var cur = state.logs[date] || {};
    Object.keys(cur).forEach(function (k) { acts[k] = cur[k]; });
    if (acts[it.sport]) delete acts[it.sport];
    else acts[it.sport] = it.sport === 'gym' ? { min: null, routine: it.routine || null }
      : it.sport === 'hyrox' ? { min: null, note: '' }
      : it.sport === 'other' ? { min: null, km: null, note: it.note || '' }
      : { km: it.km == null ? null : it.km };
    setDay(date, acts);
    render();
  }

  /* ---------- Operaciones de semana ---------- */
  async function copyWeek(fromMon, toMons) {
    var copied = 0;
    for (var w = 0; w < toMons.length; w++) {
      for (var i = 0; i < 7; i++) {
        var src = state.plans[ymd(addDays(fromMon, i))];
        var dstKey = ymd(addDays(toMons[w], i));
        if (!src || !src.length) continue;
        if ((state.plans[dstKey] || []).length) continue;
        copied++;
        await setPlan(dstKey, src.map(function (x) { return { id: uid(), sport: x.sport, km: x.km == null ? null : x.km, routine: x.routine || null, note: x.note || null, text: x.text || '' }; }));
      }
    }
    render();
    return copied;
  }

  async function copyPrev() {
    var from = addDays(state.week, -7);
    var hasSrc = [0,1,2,3,4,5,6].some(function (i) { return (state.plans[ymd(addDays(from, i))] || []).length; });
    if (!hasSrc) { toast('La semana anterior no tiene sesiones'); return; }
    var n = await copyWeek(from, [state.week]);
    toast(n ? 'Copiados ' + n + (n === 1 ? ' día' : ' días') : 'Los días ya tenían sesiones');
  }

  async function repeat4() {
    if (!weekDates().some(function (d) { return (state.plans[d] || []).length; })) { toast('Primero planifica esta semana'); return; }
    var tos = [1, 2, 3, 4].map(function (k) { return addDays(state.week, 7 * k); });
    var n = await copyWeek(state.week, tos);
    toast(n ? 'Plan repetido en las próximas 4 semanas' : 'Esas semanas ya tenían sesiones');
  }

  async function clearWeek() {
    if (state.confirm !== 'clear') {
      state.confirm = 'clear';
      render();
      setTimeout(function () { if (state.confirm === 'clear') { state.confirm = null; render(); } }, 4000);
      return;
    }
    state.confirm = null;
    var dates = weekDates();
    for (var i = 0; i < dates.length; i++) {
      if ((state.plans[dates[i]] || []).length) await setPlan(dates[i], []);
    }
    render();
    toast('Semana vaciada');
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function (e) {
    if (e.target === sheetEl) { closeSheet(); return; }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var date = el.getAttribute('data-date');
    var id = el.getAttribute('data-id');
    if (act !== 'clear-week') state.confirm = null;

    switch (act) {
      case 'tab': state.tab = el.getAttribute('data-tab'); render(); break;
      case 'auth-tab':
        var ee = document.getElementById('auth-email'); if (ee) authEmail = ee.value;
        authView = el.getAttribute('data-v'); render(); break;
      case 'forgot': doForgot(); break;
      case 'logout': if (sb) sb.auth.signOut(); break;
      case 'strava-connect': stravaConnect(); break;
      case 'strava-sync': stravaSync(true); break;
      case 'lock-toggle': if (lockEnabled()) disableLock(); else enableLock(); break;
      case 'unlock': unlock(false); break;
      case 'lock-reset':
        try { localStorage.removeItem(LOCK_KEY); } catch (e) {}
        state.locked = false;
        if (sb) sb.auth.signOut();
        render();
        break;
      case 'prev-month': state.month = new Date(state.month.getFullYear(), state.month.getMonth() - 1, 1); render(); break;
      case 'next-month': state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); render(); break;
      case 'this-month': var n = new Date(); state.month = new Date(n.getFullYear(), n.getMonth(), 1); render(); break;
      case 'prev-week': state.week = addDays(state.week, -7); render(); break;
      case 'next-week': state.week = addDays(state.week, 7); render(); break;
      case 'this-week': state.week = mondayOf(new Date()); render(); break;
      case 'open-day': openDay(date); break;
      case 'add-plan': openPlan(date, null); break;
      case 'edit-plan': openPlan(date, id); break;
      case 'toggle-done': toggleDone(date, id); break;
      case 'copy-prev': copyPrev(); break;
      case 'repeat-4': repeat4(); break;
      case 'clear-week': clearWeek(); break;
      case 'close-sheet': closeSheet(); break;
      case 'plan-done': autoSavePlan(true, true); closeSheet(); break;
      case 'prev-year': state.year--; render(); break;
      case 'next-year': state.year++; render(); break;
      case 'this-year': state.year = new Date().getFullYear(); render(); break;
      case 'goto-month':
        state.month = new Date(state.year, parseInt(el.getAttribute('data-m'), 10), 1);
        state.tab = 'log'; render(); window.scrollTo(0, 0); break;
      case 'clear-day':
        state.sheet.skipFlush = true;
        setDay(state.sheet.date, {}, '');
        closeSheet(); render(); toast('Día borrado');
        break;
      case 'use-plan': usePlan(); sheetAuto(true); break;
      case 'chip':
        var sp = el.getAttribute('data-sport');
        if (state.sheet && state.sheet.type === 'day') {
          var cb = q('#chk-' + sp);
          if (!cb.checked) { cb.checked = true; toggleRow(sp, true); }
          q('#val-' + sp).value = dec(el.getAttribute('data-v'));
        } else q('#pkm').value = dec(el.getAttribute('data-v'));
        sheetAuto(true);
        break;
      case 'pick-routine':
        var rt = el.getAttribute('data-routine');
        state.sheet.routine = state.sheet.routine === rt ? null : rt;
        syncRoutineChips();
        sheetAuto(true);
        break;
      case 'ex-inc': stepSets(el.getAttribute('data-r'), id, 1); break;
      case 'ex-dec': stepSets(el.getAttribute('data-r'), id, -1); break;
      case 'edit-ex': openEx(el.getAttribute('data-r'), id); break;
      case 'add-ex': openEx(el.getAttribute('data-r'), null); break;
      case 'save-ex': saveEx(); break;
      case 'delete-ex': deleteEx(); break;
      case 'group-chip': q('#ex-group').value = el.getAttribute('data-v'); break;
      case 'log-routine': logRoutine(el.getAttribute('data-r')); break;
      case 'delete-plan': deletePlan(); break;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!state.sheet) return;
    if (state.sheet.type === 'day' && t.matches('input[type=checkbox][data-sport]')) {
      toggleRow(t.getAttribute('data-sport'), t.checked);
    }
    if (state.sheet.type === 'plan' && t.name === 'psport') {
      var gym = t.value === 'gym', kmSport = isKm(t.value);
      q('#pkm-wrap').hidden = !kmSport;
      q('#proutine-wrap').hidden = !gym;
      q('#pnote-wrap').hidden = t.value !== 'other';
      if (kmSport) q('#pchips').innerHTML = chipsHtml(t.value);
    }
    sheetAuto(true);
  });

  document.addEventListener('input', function (e) {
    if (state.sheet && panelEl.contains(e.target)) sheetAuto(false);
  });
  document.addEventListener('click', function (e) {
    if (state.sheet && state.sheet.type === 'plan' && e.target.closest && e.target.closest('.segopt')) setTimeout(function () { sheetAuto(true); }, 0);
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushSheet(); });
  window.addEventListener('pagehide', flushSheet);

  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.id === 'authform') { e.preventDefault(); doAuth(); }
    else if (f.id === 'newpassform') { e.preventDefault(); doNewPass(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheetEl.hidden) closeSheet();
  });

  /* ---------- Cambio de día ---------- */
  var lastDay = ymd(new Date());
  function checkDay() {
    var now = new Date(), k = ymd(now);
    if (k === lastDay) return;
    var old = parse(lastDay);
    lastDay = k;
    if (state.month.getFullYear() === old.getFullYear() && state.month.getMonth() === old.getMonth()) state.month = new Date(now.getFullYear(), now.getMonth(), 1);
    if (ymd(state.week) === ymd(mondayOf(old))) state.week = mondayOf(now);
    render();
  }
  setInterval(checkDay, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDay(); });
  window.addEventListener('focus', checkDay);

  /* ---------- Strava (los tokens viven solo en el servidor) ---------- */
  var STRAVA_FN = SUPA_URL + '/functions/v1/strava';
  var STRAVA_CLIENT_ID = '284065';
  var stravaBusy = false, stravaLast = 0;
  state.strava = 'unknown';

  function stravaBtnHtml() {
    if (state.strava === 'off') return '<button class="linkbtn" data-act="strava-connect">Conectar Strava</button>';
    if (state.strava === 'on') return '<button class="linkbtn" data-act="strava-sync">Strava ✓</button>';
    if (state.strava === 'err') return '<button class="linkbtn" data-act="strava-sync">Strava ⚠</button>';
    return '';
  }
  async function stravaCall(body) {
    var g = await sb.auth.getSession();
    var tok = g && g.data && g.data.session && g.data.session.access_token;
    if (!tok) throw new Error('auth');
    var r = await fetch(STRAVA_FN, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok, 'apikey': SUPA_KEY }, body: JSON.stringify(body) });
    var j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { var er = new Error((j && j.error) || ('http' + r.status)); er.code = j && j.error; throw er; }
    return j;
  }
  function stravaConnect() {
    var st = Array.prototype.map.call(rnd(16), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    try { localStorage.setItem('strava-state', st); } catch (e) {}
    var redirect = location.origin + location.pathname;
    location.href = 'https://www.strava.com/oauth/authorize?client_id=' + STRAVA_CLIENT_ID + '&response_type=code&redirect_uri=' + encodeURIComponent(redirect) + '&approval_prompt=auto&scope=activity:read_all&state=' + st;
  }
  function stravaErr(e) {
    if (e && e.code === 'rate_limit') return 'Strava: demasiadas consultas, prueba en unos minutos.';
    if (e && e.code === 'secret_missing') return 'Falta terminar de configurar Strava en el servidor.';
    if (e && e.code === 'auth') return 'Vuelve a iniciar sesión y prueba otra vez.';
    return 'No se pudo hablar con el servidor de Strava' + (e && e.message ? ' (' + e.message + ')' : '') + '.';
  }
  /* Añade lo que falta; nunca pisa lo que ya apuntaste a mano. */
  function stravaMerge(list) {
    var g = {}, count = 0, ps = [], keys = [];
    list.forEach(function (a) {
      var d = g[a.day] = g[a.day] || {};
      var x = d[a.sport] = d[a.sport] || { km: 0, min: 0, names: [], n: 0 };
      x.km += a.km || 0; x.min += a.min || 0; x.n++;
      if (a.name && x.names.indexOf(a.name) < 0) x.names.push(a.name);
    });
    Object.keys(g).forEach(function (day) {
      var cur = state.logs[day] || {}, next = {}, changed = false;
      Object.keys(cur).forEach(function (k) { next[k] = cur[k]; });
      Object.keys(g[day]).forEach(function (sp) {
        if (next[sp]) return;
        var v = g[day][sp], km = Math.round(v.km * 100) / 100, nm = v.names.join(' · ');
        if (sp === 'gym') next[sp] = { min: v.min, routine: null };
        else if (sp === 'hyrox') next[sp] = { min: v.min, note: nm };
        else if (sp === 'other') next[sp] = { min: v.min, km: km > 0 ? km : null, note: nm };
        else next[sp] = { km: km };
        count += v.n; changed = true;
      });
      if (changed) { state.logs[day] = next; keys.push('l-' + day); ps.push(persist('l', day)); }
    });
    return { count: count, ps: ps, keys: keys };
  }
  async function stravaSync(manual) {
    if (stravaBusy || !sb || !userId() || state.mode !== 'db') return;
    stravaBusy = true;
    try {
      var r = await stravaCall({ action: 'sync' });
      if (!r.connected) {
        state.strava = 'off';
        if (manual || r.reason === 'revoked') toast(r.reason === 'revoked' ? 'Strava se desconectó. Vuelve a conectarlo.' : 'Strava no está conectado.');
        if (sheetEl.hidden) render();
        stravaBusy = false; return;
      }
      state.strava = 'on';
      var acts = r.activities || [];
      var m = stravaMerge(acts);
      await Promise.all(m.ps);
      var lost = m.keys.some(function (k) { return failed[k]; });
      if (acts.length && !lost) {
        var upto = 0; acts.forEach(function (a) { if (a.start > upto) upto = a.start; });
        await stravaCall({ action: 'ack', ids: acts.map(function (a) { return a.id; }), upto: upto });
      }
      if (m.count) toast('Strava: ' + m.count + (m.count === 1 ? ' entreno nuevo' : ' entrenos nuevos'));
      else if (manual) toast('Strava al día');
      stravaLast = Date.now();
      if (sheetEl.hidden) render();
    } catch (e) {
      if (state.strava !== 'on') { state.strava = 'err'; if (sheetEl.hidden) render(); }
      if (manual) toast(stravaErr(e));
    }
    stravaBusy = false;
  }
  async function stravaFinish() {
    var r = stravaReturn; stravaReturn = null;
    if (!r) return;
    if (r.denied) { toast('No has dado permiso a Strava.'); return stravaSync(false); }
    if (r.scope.indexOf('activity:read') < 0) { toast('Strava necesita permiso para ver tus actividades. Vuelve a conectar y deja esa casilla marcada.'); return stravaSync(false); }
    try {
      var y = new Date().getFullYear();
      await stravaCall({ action: 'connect', code: r.code, since: Math.floor(new Date(y, 0, 1).getTime() / 1000) });
      state.strava = 'on';
      toast('Strava conectado. Importando entrenos…');
      await stravaSync(true);
    } catch (e) { toast(stravaErr(e)); }
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.strava === 'on' && Date.now() - stravaLast > 300000) stravaSync(false);
  });

  /* ---------- Arranque ---------- */
  function refreshFromServer() {
    if (state.mode !== 'db' && state.mode !== 'offline') return;
    retryFailed();
    loadAll().then(function () {
      if (state.mode === 'offline') state.mode = 'db';
      if (sheetEl.hidden) render();
    }).catch(function () { if (state.mode === 'db') { state.mode = 'offline'; if (sheetEl.hidden) render(); } });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshFromServer(); });
  window.addEventListener('online', refreshFromServer);

  state.locked = lockEnabled();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (lockEnabled() && hiddenAt && Date.now() - hiddenAt > LOCK_AFTER_MS && !state.locked) lockNow();
  });
  if (window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function (ok) {
      lockAvail = !!ok;
      if (ok && !state.locked && sheetEl.hidden) render();
    }).catch(function () {});
  }

  if (!window.supabase || !window.supabase.createClient) {
    state.mode = 'off';
    render();
  } else {
    sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    render();
    sb.auth.onAuthStateChange(function (ev, sess) {
      if (ev === 'PASSWORD_RECOVERY') { session = sess; state.mode = 'recovery'; setTimeout(render, 0); return; }
      if (ev === 'SIGNED_OUT') { setTimeout(endSession, 0); return; }
      if (ev === 'TOKEN_REFRESHED' || ev === 'USER_UPDATED') { session = sess; return; }
      if (ev === 'INITIAL_SESSION' || ev === 'SIGNED_IN') {
        var before = userId();
        session = sess;
        if (!sess) { state.mode = 'auth'; setTimeout(render, 0); return; }
        if (state.mode === 'recovery') return;
        if (sess.user.id !== before || state.mode === 'auth' || state.mode === 'loading') setTimeout(startSession, 0);
      }
    });
  }

  if (state.locked) setTimeout(function () { unlock(true); }, 300);

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
